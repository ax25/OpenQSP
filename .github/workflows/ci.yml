name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './server[test]'
          python -m pip install "ruff==0.16.2"

      - name: Run tests
        run: python -m pytest -q server/tests

      - name: Run Ruff
        run: ruff check server/src server/tests tools

      - name: Compile Python sources
        run: python -m compileall -q server/src server/tests tools
