[project]
name = "openqsp-server"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
openqsp-server = "openqsp.server.tcp:main"
openqsp-client = "openqsp.client.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
