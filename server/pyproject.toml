[project]
name = "openqsp-server"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
openqsp-server = "openqsp.server.app:main"
openqsp-client = "openqsp.client.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
